name: Rater
options:
  bundleIdPrefix: com.rater
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  # The MLX VLM runtime and the Hugging Face tokenizer adapters used by the
  # Agent target. Keep the pinned minors when touching these.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  # AppKit-free core: catalog, CPU reference programs, prompt building, tool
  # dispatch, image import, transcript store, and the Metal render core.
  Core:
    type: framework
    platform: macOS
    sources:
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rater.Core
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  # The MLX VLM. The only target that links mlx-swift-lm and Hugging Face.
  Agent:
    type: framework
    platform: macOS
    sources:
      - Agent
    dependencies:
      - target: Core
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rater.Agent
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  # The single-panel app.
  Client:
    type: application
    platform: macOS
    sources:
      - Client
    dependencies:
      - target: Core
        embed: true
      - target: Agent
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rater.app
        PRODUCT_NAME: "Rater"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "Rater"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CoreTests
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rater.CoreTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
  # Headless CLI: render catalog entries to PNG, and run the real MLX agent over
  # a folder of images.
  rater-cli:
    type: tool
    platform: macOS
    sources:
      - CLI
    dependencies:
      - target: Core
      - target: Agent
    settings:
      base:
        PRODUCT_NAME: rater-cli
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
schemes:
  Client:
    build:
      targets:
        Client: all
    run:
      config: Release
  CoreTests:
    build:
      targets:
        Core: all
        CoreTests: [test]
    test:
      config: Debug
      targets:
        - CoreTests
